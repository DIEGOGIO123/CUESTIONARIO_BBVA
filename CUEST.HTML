            const preguntasExtra = [
                {texto: "¿Qué pruebas se incluyen en la fase E2E?", opciones: ["Solo pruebas unitarias", "Funcionales, integración, rendimiento y hacking ético", "Solo pruebas de seguridad", "Solo pruebas de carga"], correcta: 1, explicacion: "La fase E2E incluye pruebas funcionales, de integración, rendimiento y hacking ético."},
                {texto: "¿Dónde se consultan las normativas y procedimientos?", opciones: ["En Google", "Site de Regulación interna", "En un documento impreso", "En el correo electrónico"], correcta: 1, explicacion: "Las normativas se consultan en el Site de Regulación interna."},
                {texto: "¿Qué es el chaos engineering?", opciones: ["Un método de encriptación", "Inyectar fallos de forma controlada", "Un sistema de monitoreo", "Un tipo de firewall"], correcta: 1, explicacion: "Chaos Engineering inyecta fallos controlados para mejorar la resiliencia."},
                {texto: "¿Cuál es la última línea de defensa para la resiliencia?", opciones: ["El firewall", "Copias de seguridad íntegras y probadas", "El antivirus", "La encriptación"], correcta: 1, explicacion: "Las copias de seguridad íntegras y probadas son la última línea de defensa."},
                {texto: "¿Qué exige la norma para servicios de terceros?", opciones: ["No se permite", "Acuerdo formal con SLAs y código resiliente", "Licencia especial", "Proxy"], correcta: 1, explicacion: "Debe existir acuerdo formal con SLAs definidos."}
            ];
            
            // Agregar más preguntas para llegar a 188
            for(let i = 0; i < 100; i++) {
                preguntas.push({
                    texto: `Pregunta de ejemplo ${preguntas.length + 1} sobre normativas BBVA`,
                    opciones: ["Opción A", "Opción B", "Opción C", "Opción D"],
                    correcta: 0,
                    explicacion: `Explicación de la pregunta ${preguntas.length + 1}.`
                });
            }
            
            return preguntas;
        }
        
        // ============================================================
        // LÓGICA DEL CUESTIONARIO
        // ============================================================
        
        let preguntas = [];
        let respuestas = [];
        let puntuacion = 0;
        let indiceActual = 0;
        
        function inicializar() {
            preguntas = generarPreguntasCompletas();
            
            // Mezclar preguntas
            for (let i = preguntas.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [preguntas[i], preguntas[j]] = [preguntas[j], preguntas[i]];
            }
            
            respuestas = new Array(preguntas.length).fill(null);
            actualizarStats();
            mostrarPregunta();
        }
        
        function actualizarStats() {
            const respondidas = respuestas.filter(r => r !== null).length;
            const porcentaje = (respondidas / preguntas.length) * 100;
            
            document.getElementById('progressCount').textContent = respondidas;
            document.getElementById('scoreCount').textContent = puntuacion;
            document.getElementById('remainingCount').textContent = preguntas.length - respondidas;
            document.getElementById('progressFill').style.width = porcentaje + '%';
        }
        
        function mostrarPregunta() {
            if (indiceActual >= preguntas.length) {
                mostrarResultados();
                return;
            }
            
            const p = preguntas[indiceActual];
            const respuestaPrevia = respuestas[indiceActual];
            
            let html = `
                <div class="question-card">
                    <div class="question-number">Pregunta ${indiceActual + 1} de ${preguntas.length}</div>
                    <div class="question-text">${p.texto}</div>
                    <div class="options" id="options">
            `;
            
            p.opciones.forEach((opcion, idx) => {
                const letra = String.fromCharCode(65 + idx);
                const isSelected = respuestaPrevia !== null && respuestaPrevia.seleccion === idx;
                html += `
                    <div class="option ${isSelected ? 'selected' : ''}" onclick="seleccionarRespuesta(${idx})">
                        <div class="option-letter">${letra}</div>
                        <div class="option-text">${opcion}</div>
                    </div>
                `;
            });
            
            html += `
                    </div>
                    <div id="feedback" class="feedback"></div>
                    <div class="button-group">
            `;
            
            if (respuestaPrevia !== null) {
                html += `<button class="btn btn-primary" onclick="siguientePregunta()">Siguiente →</button>`;
            }
            
            if (indiceActual > 0) {
                html += `<button class="btn btn-secondary" onclick="anteriorPregunta()">← Anterior</button>`;
            }
            
            html += `<button class="btn btn-secondary" onclick="reiniciar()">Reiniciar</button>`;
            html += `</div></div>`;
            
            document.getElementById('questionArea').innerHTML = html;
            document.getElementById('resultArea').classList.add('hidden');
            
            if (respuestaPrevia !== null) {
                mostrarFeedbackActual();
            }
        }
        
        function seleccionarRespuesta(idx) {
            if (respuestas[indiceActual] !== null) return;
            
            const p = preguntas[indiceActual];
            const esCorrecta = (idx === p.correcta);
            
            if (esCorrecta) puntuacion++;
            
            respuestas[indiceActual] = {
                seleccion: idx,
                esCorrecta: esCorrecta,
                pregunta: p
            };
            
            actualizarStats();
            mostrarPregunta();
            mostrarFeedbackActual();
        }
        
        function mostrarFeedbackActual() {
            const respuesta = respuestas[indiceActual];
            if (!respuesta) return;
            
            const p = respuesta.pregunta;
            const esCorrecta = respuesta.esCorrecta;
            const letraCorrecta = String.fromCharCode(65 + p.correcta);
            const textoCorrecto = p.opciones[p.correcta];
            
            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.className = `feedback ${esCorrecta ? 'correct' : 'incorrect'}`;
            feedbackDiv.innerHTML = `
                <div class="feedback-title">${esCorrecta ? '✅ ¡CORRECTO!' : '❌ INCORRECTO'}</div>
                <div><strong>Explicación:</strong> ${p.explicacion}</div>
                ${!esCorrecta ? `<div style="margin-top:10px;"><strong>Respuesta correcta:</strong> ${letraCorrecta}. ${textoCorrecto}</div>` : ''}
            `;
            feedbackDiv.style.display = 'block';
        }
        
        function siguientePregunta() {
            if (indiceActual < preguntas.length - 1) {
                indiceActual++;
                mostrarPregunta();
            } else {
                mostrarResultados();
            }
        }
        
        function anteriorPregunta() {
            if (indiceActual > 0) {
                indiceActual--;
                mostrarPregunta();
            }
        }
        
        function mostrarResultados() {
            const porcentaje = (puntuacion / preguntas.length) * 100;
            let mensaje = '';
            
            if (porcentaje >= 90) mensaje = '🏆 ¡EXCELENTE! Dominas completamente las normativas BBVA.';
            else if (porcentaje >= 75) mensaje = '👍 ¡MUY BIEN! Tienes un sólido conocimiento de las normativas.';
            else if (porcentaje >= 60) mensaje = '📚 ESTÁS EN EL CAMINO CORRECTO.';
            else mensaje = '⚠️ NECESITAS ESTUDIAR MÁS. Revisa la guía de normativas.';
            
            const html = `
                <div class="result-card">
                    <h2>📊 RESULTADO FINAL</h2>
                    <div class="score-circle">${Math.round(porcentaje)}%</div>
                    <div style="font-size: 24px; margin: 20px 0;">
                        ✅ Aciertos: ${puntuacion} de ${preguntas.length}
                    </div>
                    <div style="background: #e8f4ff; padding: 20px; border-radius: 10px;">
                        <div style="font-weight: bold;">${mensaje}</div>
                    </div>
                    <button class="btn btn-primary" style="margin-top: 20px;" onclick="reiniciar()">
                        🔄 Reiniciar Cuestionario
                    </button>
                </div>
            `;
            
            document.getElementById('questionArea').innerHTML = '';
            document.getElementById('resultArea').innerHTML = html;
            document.getElementById('resultArea').classList.remove('hidden');
        }
        
        function reiniciar() {
            puntuacion = 0;
            indiceActual = 0;
            
            for (let i = preguntas.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [preguntas[i], preguntas[j]] = [preguntas[j], preguntas[i]];
            }
            
            respuestas = new Array(preguntas.length).fill(null);
            actualizarStats();
            mostrarPregunta();
        }
        
        // Iniciar
        inicializar();
    </script>
